[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloc"
version = "0.2.0"
readme = "README.md"
description = "Execution-evidence based DApp fault localization"
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0"]

[project.scripts]
cloc = "cloc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cloc*"]

